# ==============================================================================
# Docker Compose Orchestration File
# Deploys the FastAPI Application Service along with Prometheus Monitoring
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkific_api_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Linkific Production Service
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - API_SECRET_KEY=production-secret-change-in-cloud-vault
      - ALLOWED_ORIGINS=*
      - METRICS_ENABLED=true
      - ENABLE_SYSTEM_TELEMETRY=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - linkific-net

  prometheus:
    image: prom/prometheus:latest
    container_name: linkific_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - linkific-net

networks:
  linkific-net:
    driver: bridge
