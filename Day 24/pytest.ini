[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    unit: Fast-running isolated unit tests
    api: API integration and HTTP endpoint tests
    monitoring: Telemetry and Prometheus metrics verification
    slow: Tests that take longer than normal execution
filterwarnings =
    ignore::DeprecationWarning
